name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_VARIANT: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'Release' || 'Debug' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build, test and lint
        run: ./gradlew --no-daemon ":app:assemble${BUILD_VARIANT}" ":app:test${BUILD_VARIANT}UnitTest" ":app:lint${BUILD_VARIANT}"
      - name: Check tag against APK version
        if: env.BUILD_VARIANT == 'Release'
        run: |
          version=$(jq -er '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match APK version v$version" >&2
            exit 1
          fi
      - name: Upload debug APK
        if: env.BUILD_VARIANT == 'Debug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velvet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned release APK for signing
        if: env.BUILD_VARIANT == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velvet-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/test*UnitTest/
            app/build/reports/lint-results-*.html
            app/build/test-results/test*UnitTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: velvet-release-unsigned
      - name: Install Android Build Tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Sign and verify APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.VELVET_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.VELVET_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?Set VELVET_RELEASE_KEYSTORE_BASE64}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Set VELVET_RELEASE_KEYSTORE_PASSWORD}"
          umask 077
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset RELEASE_KEYSTORE_BASE64

          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="velvet-${GITHUB_REF_NAME}.apk"
          "$tools/zipalign" -P 16 -f 4 app-release-unsigned.apk aligned.apk
          "$tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias velvet-release \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEYSTORE_PASSWORD \
            --v4-signing-enabled false --out "$apk" aligned.apk
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          apk="velvet-${tag}.apk"
          if release=$(gh release view "$tag" --json isDraft,assets); then
            if [[ $(jq -r '.isDraft' <<< "$release") == 'false' ]]; then
              jq -e --arg apk "$apk" '
                [.assets[] | select(.state == "uploaded") | .name]
                | (index($apk) != null) and (index($apk + ".sha256") != null)
              ' <<< "$release" > /dev/null
              echo "Release $tag already has both published assets."
              exit 0
            fi
          else
            gh release create "$tag" --draft --verify-tag --title "Velvet $tag" --generate-notes \
              --notes "Install $apk on Android. See the [changelog]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md)."
          fi

          gh release upload "$tag" "$apk" "$apk.sha256" --clobber
          gh release edit "$tag" --draft=false
